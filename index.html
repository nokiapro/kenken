<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GitHub File Storage</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css" />
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --success: #16a34a;
      --danger: #dc2626;
      --purple: #7c3aed;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --radius: 12px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      -webkit-tap-highlight-color: transparent;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 12px;
    }

    header {
      text-align: center;
      margin-bottom: 16px;
      padding-top: 8px;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    header h1 i { font-size: 1.3rem; }

    header p {
      color: var(--muted);
      margin-top: 4px;
      font-size: 0.8rem;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: 0 1px 8px rgba(0,0,0,0.06);
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
    }

    .card h2 {
      font-size: 0.95rem;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .card h2 i { font-size: 0.95rem; }

    .form-group { margin-bottom: 12px; }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 4px;
      color: var(--text);
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
      background: #fff;
      transition: border-color 0.2s;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
    }

    small {
      color: var(--muted);
      font-size: 0.7rem;
      display: block;
      margin-top: 4px;
      line-height: 1.4;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .btn i { font-size: 0.85rem; }

    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); }

    .btn-success { background: var(--success); color: #fff; }
    .btn-success:hover { background: #15803d; }

    .btn-danger {
      background: var(--danger);
      color: #fff;
      padding: 7px 10px;
      font-size: 0.8rem;
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 10px;
      font-size: 0.8rem;
    }

    .btn-outline:hover { background: #f8fafc; }

    .btn-play {
      background: var(--purple);
      color: #fff;
      padding: 7px 10px;
      font-size: 0.8rem;
    }

    .btn-play:hover { background: #6d28d9; }

    .btn:disabled { opacity: 0.55; cursor: not-allowed; }

    .btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: 10px;
      padding: 20px 12px;
      text-align: center;
      cursor: pointer;
      background: #fafbfc;
      transition: all 0.2s;
    }

    .upload-zone:hover,
    .upload-zone.dragover {
      border-color: var(--primary);
      background: #eff6ff;
    }

    .upload-zone i {
      font-size: 1.8rem;
      color: var(--primary);
      margin-bottom: 8px;
    }

    .upload-zone p {
      color: var(--muted);
      font-size: 0.85rem;
    }

    .path-input { margin-top: 10px; }

    .path-input input {
      width: 100%;
      font-size: 0.85rem;
      padding: 9px 12px;
    }

    .file-list { list-style: none; }

    .file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 8px;
      border-bottom: 1px solid var(--border);
      gap: 8px;
    }

    .file-item:last-child { border-bottom: none; }
    .file-item:hover { background: #f8fafc; }
    .file-item.folder { cursor: pointer; }
    .file-item.folder:hover { background: #eff6ff; }

    .file-info {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }

    .file-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: #eff6ff;
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      flex-shrink: 0;
    }

    .file-icon.folder { background: #fef3c7; color: #d97706; }
    .file-icon.video { background: #f3e8ff; color: #7c3aed; }
    .file-icon.audio { background: #fce7f3; color: #db2777; }

    .file-name {
      font-weight: 500;
      font-size: 0.875rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-meta {
      font-size: 0.7rem;
      color: var(--muted);
    }

    .file-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .breadcrumb {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px;
      padding: 8px 10px;
      background: #f8fafc;
      border-radius: 8px;
      margin-bottom: 10px;
      font-size: 0.8rem;
    }

    .breadcrumb-item {
      color: var(--primary);
      cursor: pointer;
      font-weight: 500;
      padding: 2px 5px;
      border-radius: 4px;
    }

    .breadcrumb-item:hover { background: #e0e7ff; }

    .breadcrumb-item.current {
      color: var(--text);
      cursor: default;
      font-weight: 600;
    }

    .breadcrumb-item.current:hover { background: transparent; }

    .breadcrumb-sep {
      color: var(--muted);
      font-size: 0.65rem;
    }

    .status {
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 0.8rem;
      display: none;
    }

    .status.show { display: block; }
    .status.success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
    .status.error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    .status.info { background: #dbeafe; color: #1e40af; border: 1px solid #bfdbfe; }

    .empty-state {
      text-align: center;
      padding: 28px 12px;
      color: var(--muted);
    }

    .empty-state i {
      font-size: 2rem;
      margin-bottom: 8px;
      opacity: 0.35;
    }

    .empty-state p { font-size: 0.85rem; }

    .config-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
    }

    .config-header h2 { margin-bottom: 0; }

    .config-toggle {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 8px;
      cursor: pointer;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .config-body {
      margin-top: 12px;
      overflow: hidden;
      transition: max-height 0.3s ease, opacity 0.25s ease;
    }

    .config-body.collapsed {
      max-height: 0 !important;
      opacity: 0;
      margin-top: 0;
      pointer-events: none;
    }

    .connected-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #dcfce7;
      color: #166534;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 12px;
      margin-left: 6px;
    }

    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      gap: 8px;
    }

    .list-header h2 { margin: 0; }

    footer {
      text-align: center;
      margin-top: 24px;
      padding-bottom: 20px;
      color: var(--muted);
      font-size: 0.75rem;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .hidden { display: none !important; }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 12px;
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s;
    }

    .modal-overlay.show {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      background: #1a1a2e;
      border-radius: 12px;
      width: 100%;
      max-width: 720px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      transform: scale(0.96);
      transition: transform 0.25s;
    }

    .modal-overlay.show .modal { transform: scale(1); }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: #16213e;
      color: #fff;
    }

    .modal-header h3 {
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 80%;
    }

    .modal-close {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      line-height: 1;
    }

    .modal-close:hover { background: #1e293b; color: #fff; }

    .modal-body {
      background: #000;
      min-height: 120px;
    }

    .plyr {
      --plyr-color-main: #7c3aed;
      border-radius: 0;
    }

    .plyr--audio {
      background: linear-gradient(135deg, #1e1b4b, #312e81);
      padding: 16px;
    }

    .plyr--audio .plyr__controls {
      background: transparent;
      color: #e0e7ff;
    }

    @media (min-width: 600px) {
      .container { padding: 20px 16px; }
      header h1 { font-size: 1.5rem; }
      header p { font-size: 0.9rem; }
      .card { padding: 18px; margin-bottom: 16px; }
      .card h2 { font-size: 1.05rem; }
      .btn { padding: 11px 16px; font-size: 0.9rem; }
      .btn-danger, .btn-outline, .btn-play { padding: 8px 12px; font-size: 0.85rem; }
      .file-icon { width: 40px; height: 40px; font-size: 1.05rem; }
      .file-name { font-size: 0.95rem; }
      .upload-zone { padding: 28px 16px; }
      .upload-zone i { font-size: 2.2rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1><i class="fab fa-github"></i> GitHub File Storage</h1>
      <p>Lưu trữ & quản lý file trên GitHub</p>
    </header>

    <div class="card" id="config-card">
      <div class="config-header" id="config-header">
        <h2>
          <i class="fas fa-cog"></i> Cấu hình
          <span class="connected-badge hidden" id="connected-badge">
            <i class="fas fa-check-circle"></i> Đã kết nối
          </span>
        </h2>
        <button class="config-toggle" id="config-toggle" title="Thu gọn / Mở">
          <i class="fas fa-chevron-up" id="config-toggle-icon"></i>
        </button>
      </div>
      <div class="config-body" id="config-body">
        <div class="form-group">
          <label for="username">Username GitHub</label>
          <input type="text" id="username" placeholder="your-username" autocomplete="username" />
        </div>
        <div class="form-group">
          <label for="repo">Tên Repository</label>
          <input type="text" id="repo" placeholder="my-file-storage" />
        </div>
        <div class="form-group">
          <label for="token">Personal Access Token</label>
          <input type="password" id="token" placeholder="ghp_xxxx..." autocomplete="off" />
          <small>GitHub → Settings → Developer settings → Personal access tokens → Generate (quyền <strong>repo</strong>)</small>
        </div>
        <div class="btn-group">
          <button class="btn btn-primary" id="btn-connect">
            <i class="fas fa-plug"></i> Kết nối
          </button>
          <button class="btn btn-outline" id="btn-save">
            <i class="fas fa-save"></i> Lưu
          </button>
        </div>
      </div>
    </div>

    <div id="status" class="status"></div>

    <div id="main-area" class="hidden">
      <div class="card">
        <h2><i class="fas fa-cloud-upload-alt"></i> Tải file lên</h2>
        <div class="upload-zone" id="upload-zone">
          <i class="fas fa-cloud-upload-alt"></i>
          <p>Kéo thả hoặc <strong>chạm để chọn</strong></p>
          <input type="file" id="file-input" multiple hidden />
        </div>
        <div class="path-input">
          <input type="text" id="custom-path" placeholder="Thư mục (vd: photos/2024/)" />
        </div>
        <div style="margin-top: 10px;">
          <button class="btn btn-success" id="btn-upload" disabled>
            <i class="fas fa-upload"></i> Upload
          </button>
        </div>
      </div>

      <div class="card">
        <div class="list-header">
          <h2><i class="fas fa-folder-open"></i> Files</h2>
          <button class="btn btn-outline" id="btn-refresh">
            <i class="fas fa-sync-alt"></i>
          </button>
        </div>

        <div class="breadcrumb" id="breadcrumb">
          <span class="breadcrumb-item current" data-path=""><i class="fas fa-home"></i> Gốc</span>
        </div>

        <ul class="file-list" id="file-list">
          <li class="empty-state">
            <i class="fas fa-inbox"></i>
            <p>Chưa có file nào</p>
          </li>
        </ul>
      </div>
    </div>

    <footer>GitHub File Storage · Plyr + Font Awesome</footer>
  </div>

  <div class="modal-overlay" id="media-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title">Đang phát...</h3>
        <button class="modal-close" id="modal-close"><i class="fas fa-times"></i></button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.min.js"></script>
  <script>
    let config = { username: '', repo: '', token: '' };
    let selectedFiles = [];
    let currentPath = '';
    let plyrInstance = null;
    let configCollapsed = false;

    const $ = id => document.getElementById(id);
    const statusEl = $('status');
    const uploadZone = $('upload-zone');
    const fileInput = $('file-input');
    const btnUpload = $('btn-upload');
    const fileList = $('file-list');
    const mainArea = $('main-area');
    const mediaModal = $('media-modal');
    const modalBody = $('modal-body');
    const modalTitle = $('modal-title');
    const breadcrumbEl = $('breadcrumb');

    function showStatus(msg, type = 'info') {
      statusEl.textContent = msg;
      statusEl.className = `status show ${type}`;
      setTimeout(() => statusEl.classList.remove('show'), 4000);
    }

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / 1048576).toFixed(1) + ' MB';
    }

    function getFileExt(name) {
      return (name.split('.').pop() || '').toLowerCase();
    }

    function isVideo(name) {
      return ['mp4', 'webm', 'ogg', 'mov', 'm4v', 'mkv'].includes(getFileExt(name));
    }

    function isAudio(name) {
      return ['mp3', 'wav', 'ogg', 'm4a', 'aac', 'flac', 'wma'].includes(getFileExt(name));
    }

    function getFileIcon(name) {
      if (isVideo(name)) return 'fa-file-video';
      if (isAudio(name)) return 'fa-file-audio';
      const ext = getFileExt(name);
      const map = {
        pdf: 'fa-file-pdf',
        doc: 'fa-file-word', docx: 'fa-file-word',
        xls: 'fa-file-excel', xlsx: 'fa-file-excel',
        ppt: 'fa-file-powerpoint', pptx: 'fa-file-powerpoint',
        zip: 'fa-file-zipper', rar: 'fa-file-zipper', '7z': 'fa-file-zipper',
        jpg: 'fa-file-image', jpeg: 'fa-file-image', png: 'fa-file-image',
        gif: 'fa-file-image', webp: 'fa-file-image', svg: 'fa-file-image',
        js: 'fa-file-code', ts: 'fa-file-code', html: 'fa-file-code',
        css: 'fa-file-code', json: 'fa-file-code', py: 'fa-file-code',
        txt: 'fa-file-lines', md: 'fa-file-lines'
      };
      return map[ext] || 'fa-file';
    }

    function getIconClass(name) {
      if (isVideo(name)) return 'video';
      if (isAudio(name)) return 'audio';
      return '';
    }

    function updateBreadcrumb() {
      const parts = currentPath ? currentPath.split('/').filter(Boolean) : [];
      let html = `<span class="breadcrumb-item ${parts.length === 0 ? 'current' : ''}" data-path=""><i class="fas fa-home"></i> Gốc</span>`;
      let pathSoFar = '';
      parts.forEach((part, i) => {
        pathSoFar += (pathSoFar ? '/' : '') + part;
        const isLast = i === parts.length - 1;
        html += `<span class="breadcrumb-sep"><i class="fas fa-chevron-right"></i></span>`;
        html += `<span class="breadcrumb-item ${isLast ? 'current' : ''}" data-path="${pathSoFar}">${part}</span>`;
      });
      breadcrumbEl.innerHTML = html;
      breadcrumbEl.querySelectorAll('.breadcrumb-item:not(.current)').forEach(el => {
        el.addEventListener('click', () => navigateTo(el.dataset.path));
      });
    }

    function navigateTo(path) {
      currentPath = path || '';
      $('custom-path').value = currentPath ? currentPath + '/' : '';
      listFiles();
    }

    function playMedia(url, filename) {
      if (plyrInstance) {
        plyrInstance.destroy();
        plyrInstance = null;
      }
      modalBody.innerHTML = '';
      modalTitle.textContent = filename;

      if (isVideo(filename)) {
        const video = document.createElement('video');
        video.playsInline = true;
        video.setAttribute('playsinline', '');
        video.setAttribute('controls', '');
        video.src = url;
        modalBody.appendChild(video);
        plyrInstance = new Plyr(video, {
          controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'fullscreen'],
          autoplay: true,
          ratio: '16:9'
        });
      } else if (isAudio(filename)) {
        const audio = document.createElement('audio');
        audio.setAttribute('controls', '');
        audio.src = url;
        modalBody.appendChild(audio);
        plyrInstance = new Plyr(audio, {
          controls: ['play', 'progress', 'current-time', 'duration', 'mute', 'volume'],
          autoplay: true
        });
      }

      mediaModal.classList.add('show');
      document.body.style.overflow = 'hidden';
    }

    function closeMediaModal() {
      if (plyrInstance) {
        plyrInstance.destroy();
        plyrInstance = null;
      }
      modalBody.innerHTML = '';
      mediaModal.classList.remove('show');
      document.body.style.overflow = '';
    }

    mediaModal.addEventListener('click', e => { if (e.target === mediaModal) closeMediaModal(); });
    $('modal-close').addEventListener('click', closeMediaModal);
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && mediaModal.classList.contains('show')) closeMediaModal();
    });

    function loadConfig() {
      const saved = localStorage.getItem('gh-file-storage');
      if (saved) {
        config = JSON.parse(saved);
        $('username').value = config.username || '';
        $('repo').value = config.repo || '';
        $('token').value = config.token || '';
        return true;
      }
      return false;
    }

    function saveConfig() {
      config.username = $('username').value.trim();
      config.repo = $('repo').value.trim();
      config.token = $('token').value.trim();
      localStorage.setItem('gh-file-storage', JSON.stringify(config));
      showStatus('Đã lưu cấu hình', 'success');
    }

    function toggleConfig() {
      configCollapsed = !configCollapsed;
      const body = $('config-body');
      const icon = $('config-toggle-icon');
      if (configCollapsed) {
        body.classList.add('collapsed');
        body.style.maxHeight = '0';
        icon.className = 'fas fa-chevron-down';
      } else {
        body.classList.remove('collapsed');
        body.style.maxHeight = body.scrollHeight + 50 + 'px';
        icon.className = 'fas fa-chevron-up';
      }
      localStorage.setItem('gh-config-collapsed', configCollapsed ? '1' : '0');
    }

    function setConnectedUI(connected) {
      const badge = $('connected-badge');
      if (connected) {
        badge.classList.remove('hidden');
        if (!configCollapsed) toggleConfig();
      } else {
        badge.classList.add('hidden');
      }
    }

    async function githubFetch(path, options = {}) {
      const url = `https://api.github.com/repos/${config.username}/${config.repo}/contents/${path}`;
      return fetch(url, {
        ...options,
        headers: {
          'Authorization': `token ${config.token}`,
          'Accept': 'application/vnd.github.v3+json',
          ...(options.headers || {})
        }
      });
    }

    async function listFiles() {
      updateBreadcrumb();
      try {
        const res = await githubFetch(currentPath);
        if (res.status === 404) {
          fileList.innerHTML = '<li class="empty-state"><i class="fas fa-inbox"></i><p>Thư mục trống</p></li>';
          return;
        }
        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.message || 'Không lấy được danh sách');
        }
        const data = await res.json();
        renderFileList(Array.isArray(data) ? data : [data]);
      } catch (e) {
        showStatus('Lỗi: ' + e.message, 'error');
      }
    }

    function renderFileList(files) {
      if (!files || files.length === 0) {
        fileList.innerHTML = '<li class="empty-state"><i class="fas fa-inbox"></i><p>Thư mục trống</p></li>';
        return;
      }

      files.sort((a, b) => {
        if (a.type === 'dir' && b.type !== 'dir') return -1;
        if (a.type !== 'dir' && b.type === 'dir') return 1;
        return a.name.localeCompare(b.name);
      });

      fileList.innerHTML = files.map(f => {
        const isDir = f.type === 'dir';
        const icon = isDir ? 'fa-folder' : getFileIcon(f.name);
        const iconClass = isDir ? 'folder' : getIconClass(f.name);
        const size = isDir ? 'Thư mục' : formatSize(f.size);
        const canPlay = !isDir && (isVideo(f.name) || isAudio(f.name));

        return '<li class="file-item ' + (isDir ? 'folder' : '') + '" data-path="' + f.path + '" data-type="' + f.type + '">' +
          '<div class="file-info">' +
            '<div class="file-icon ' + iconClass + '"><i class="fas ' + icon + '"></i></div>' +
            '<div style="min-width:0">' +
              '<div class="file-name">' + f.name + '</div>' +
              '<div class="file-meta">' + size + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="file-actions">' +
            (canPlay ? '<button class="btn btn-play btn-play-media" data-url="' + f.download_url + '" data-name="' + f.name + '" title="Phát"><i class="fas fa-play"></i></button>' : '') +
            (!isDir
              ? '<a class="btn btn-outline" href="' + f.download_url + '" target="_blank" download title="Tải"><i class="fas fa-download"></i></a>' +
                '<button class="btn btn-danger btn-delete" data-path="' + f.path + '" data-sha="' + f.sha + '" title="Xóa"><i class="fas fa-trash"></i></button>'
              : '<button class="btn btn-outline btn-enter-folder" data-path="' + f.path + '" title="Mở"><i class="fas fa-folder-open"></i></button>'
            ) +
          '</div>' +
        '</li>';
      }).join('');

      document.querySelectorAll('.file-item.folder').forEach(item => {
        item.addEventListener('click', e => {
          if (e.target.closest('button') || e.target.closest('a')) return;
          navigateTo(item.dataset.path);
        });
      });

      document.querySelectorAll('.btn-enter-folder').forEach(btn => {
        btn.addEventListener('click', e => { e.stopPropagation(); navigateTo(btn.dataset.path); });
      });

      document.querySelectorAll('.btn-delete').forEach(btn => {
        btn.addEventListener('click', e => { e.stopPropagation(); deleteFile(btn.dataset.path, btn.dataset.sha); });
      });

      document.querySelectorAll('.btn-play-media').forEach(btn => {
        btn.addEventListener('click', e => { e.stopPropagation(); playMedia(btn.dataset.url, btn.dataset.name); });
      });
    }

    async function uploadFiles() {
      if (selectedFiles.length === 0) return;
      let customPath = $('custom-path').value.trim().replace(/^\/+|\/+$/g, '');
      if (!customPath && currentPath) customPath = currentPath;

      btnUpload.disabled = true;
      btnUpload.innerHTML = '<span class="spinner"></span> Uploading...';

      let success = 0, fail = 0;

      for (const file of selectedFiles) {
        try {
          const content = await readFileAsBase64(file);
          const path = customPath ? customPath + '/' + file.name : file.name;

          let sha = null;
          try {
            const check = await githubFetch(path);
            if (check.ok) {
              const existing = await check.json();
              sha = existing.sha;
            }
          } catch (_) {}

          const body = {
            message: 'Add files via upload',
            content: content
          };
          if (sha) body.sha = sha;

          const res = await githubFetch(path, { method: 'PUT', body: JSON.stringify(body) });
          if (!res.ok) {
            const err = await res.json();
            throw new Error(err.message);
          }
          success++;
        } catch (e) {
          console.error(e);
          fail++;
        }
      }

      btnUpload.disabled = false;
      btnUpload.innerHTML = '<i class="fas fa-upload"></i> Upload';
      selectedFiles = [];
      fileInput.value = '';
      updateUploadButton();

      if (success > 0) {
        showStatus('Upload thành công ' + success + ' file' + (fail ? ', lỗi ' + fail : ''), fail ? 'info' : 'success');
        listFiles();
      } else {
        showStatus('Upload thất bại. Kiểm tra token & quyền repo.', 'error');
      }
    }

    function readFileAsBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function deleteFile(path, sha) {
      if (!confirm('Xóa "' + path + '"?')) return;
      try {
        const res = await githubFetch(path, {
          method: 'DELETE',
          body: JSON.stringify({ message: 'Delete file via upload', sha: sha })
        });
        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.message);
        }
        showStatus('Đã xóa: ' + path, 'success');
        listFiles();
      } catch (e) {
        showStatus('Lỗi xóa: ' + e.message, 'error');
      }
    }

    async function connect(silent) {
      if (silent === undefined) silent = false;
      config.username = $('username').value.trim();
      config.repo = $('repo').value.trim();
      config.token = $('token').value.trim();

      if (!config.username || !config.repo || !config.token) {
        if (!silent) showStatus('Điền đầy đủ thông tin', 'error');
        return false;
      }

      if (!silent) showStatus('Đang kết nối...', 'info');
      try {
        const res = await fetch('https://api.github.com/repos/' + config.username + '/' + config.repo, {
          headers: {
            'Authorization': 'token ' + config.token,
            'Accept': 'application/vnd.github.v3+json'
          }
        });
        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.message || 'Không truy cập được repo');
        }
        localStorage.setItem('gh-file-storage', JSON.stringify(config));
        if (!silent) showStatus('Kết nối thành công!', 'success');
        mainArea.classList.remove('hidden');
        setConnectedUI(true);
        currentPath = '';
        listFiles();
        return true;
      } catch (e) {
        if (!silent) showStatus('Thất bại: ' + e.message, 'error');
        mainArea.classList.add('hidden');
        setConnectedUI(false);
        return false;
      }
    }

    function updateUploadButton() {
      btnUpload.disabled = selectedFiles.length === 0;
      uploadZone.querySelector('p').innerHTML = selectedFiles.length > 0
        ? 'Đã chọn <strong>' + selectedFiles.length + '</strong> file'
        : 'Kéo thả hoặc <strong>chạm để chọn</strong>';
    }

    uploadZone.addEventListener('click', function() { fileInput.click(); });
    uploadZone.addEventListener('dragover', function(e) { e.preventDefault(); uploadZone.classList.add('dragover'); });
    uploadZone.addEventListener('dragleave', function() { uploadZone.classList.remove('dragover'); });
    uploadZone.addEventListener('drop', function(e) {
      e.preventDefault();
      uploadZone.classList.remove('dragover');
      selectedFiles = Array.from(e.dataTransfer.files);
      updateUploadButton();
    });
    fileInput.addEventListener('change', function() {
      selectedFiles = Array.from(fileInput.files);
      updateUploadButton();
    });

    $('btn-connect').addEventListener('click', function() { connect(false); });
    $('btn-save').addEventListener('click', saveConfig);
    $('btn-upload').addEventListener('click', uploadFiles);
    $('btn-refresh').addEventListener('click', listFiles);

    $('config-header').addEventListener('click', function(e) {
      if (e.target.closest('input, button.btn')) return;
      toggleConfig();
    });
    $('config-toggle').addEventListener('click', function(e) {
      e.stopPropagation();
      toggleConfig();
    });

    ['username', 'repo', 'token'].forEach(function(id) {
      $(id).addEventListener('keypress', function(e) { if (e.key === 'Enter') connect(false); });
    });

    (async function init() {
      var hasConfig = loadConfig();
      if (localStorage.getItem('gh-config-collapsed') === '1') {
        configCollapsed = false;
        toggleConfig();
      }
      if (hasConfig && config.username && config.repo && config.token) {
        await connect(true);
      }
    })();
  </script>
</body>
</html>
